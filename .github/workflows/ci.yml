name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm run test:coverage

      - run: pnpm run build

      # Загружает собранный dist настоящим Node: только так видно ошибки
      # интероперабельности с CommonJS-зависимостями и импорты CSS из JS.
      - run: pnpm run verify:dist

      - run: pnpm run build:playground
